# Linux environment with CUDA 11.8 for training.
name: curvrecdnwd
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.8.18
  - pip=24.2
  - pytorch=2.0.1
  - pytorch-cuda=11.8
  - pip:
      - numpy==1.24.4
      - scipy==1.10.1
      - scikit-learn==1.3.2
      - pandas==2.0.3
      - h5py==3.11.0
      - open3d==0.18.0
      - opencv-python==4.10.0.84
      - gdown==5.0.1
